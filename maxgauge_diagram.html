<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxGauge Architecture Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    svg {
      max-width: 1000px;
      width: 100%;
      height: auto;
    }
    .node { cursor: pointer; }
    .node:hover rect { opacity: 0.85; }
    .t  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #0C447C; }
    .th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #0C447C; }
    .ts { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #444; }
  </style>
</head>
<body>
<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="agray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ══ Layer backgrounds ══ -->
  <rect x="8" y="8" width="200" height="490" rx="10" fill="none" stroke="#9FE1CB" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="ts" x="108" y="27" text-anchor="middle" fill="#0F6E56" font-weight="600">Data Collection Layer</text>

  <rect x="220" y="8" width="248" height="490" rx="10" fill="none" stroke="#9FE1CB" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="ts" x="344" y="27" text-anchor="middle" fill="#0F6E56" font-weight="600">MaxGauge AP Server Layer</text>

  <rect x="480" y="8" width="200" height="230" rx="10" fill="none" stroke="#9FE1CB" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="ts" x="580" y="27" text-anchor="middle" fill="#0F6E56" font-weight="600">Web Client Layer</text>

  <!-- Data Storage Layer sub-region -->
  <rect x="244" y="388" width="200" height="92" rx="8" fill="none" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="ts" x="344" y="488" text-anchor="middle" fill="#0F6E56">Data Storage Layer</text>

  <!-- Oracle cylinder -->
  <ellipse cx="108" cy="65" rx="44" ry="10" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <rect x="64" y="65" width="88" height="50" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <ellipse cx="108" cy="115" rx="44" ry="10" fill="#85B7EB" stroke="#185FA5" stroke-width="0.8"/>
  <text class="th" x="108" y="92" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Oracle</text>

  <!-- RTS -->
  <rect x="38" y="185" width="130" height="56" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="103" y="207" text-anchor="middle" dominant-baseline="central" fill="#fff">RTS</text>
  <text class="ts" x="103" y="228" text-anchor="middle" dominant-baseline="central" fill="#cce4f7">클릭하여 설정</text>

  <!-- Oracle bottom → RTS top -->
  <line x1="108" y1="115" x2="108" y2="183" stroke="#1D9E75" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>

  <!-- OBSD -->
  <rect x="18" y="305" width="90" height="38" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="63" y="324" text-anchor="middle" dominant-baseline="central" fill="#fff">OBSD</text>

  <!-- RTS bottom → OBSD top -->
  <line x1="63" y1="241" x2="63" y2="303" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#agray)"/>

  <!-- File -->
  <rect x="120" y="305" width="76" height="38" rx="8" fill="#fff" stroke="#aaa" stroke-width="0.8"/>
  <text class="th" x="158" y="324" text-anchor="middle" dominant-baseline="central" fill="#333">File</text>

  <!-- SNDF -->
  <rect x="48" y="400" width="90" height="38" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="93" y="419" text-anchor="middle" dominant-baseline="central" fill="#fff">SNDF</text>

  <!-- OBSD bottom → SNDF top -->
  <line x1="63" y1="343" x2="63" y2="398" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#agray)"/>

  <!-- SNDF right → File bottom -->
  <line x1="138" y1="411" x2="148" y2="343" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#agray)"/>

  <!-- File top → RTS bottom -->
  <line x1="150" y1="305" x2="140" y2="243" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#agray)"/>

  <!-- SNDF → Data Gather_S1: blue dashed -->
  <line x1="138" y1="419" x2="230" y2="338" stroke="#378ADD" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ab)"/>

  <!-- PlatformJS -->
  <rect x="232" y="50" width="212" height="56" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="338" y="72" text-anchor="middle" dominant-baseline="central" fill="#fff">PlatformJS</text>
  <text class="ts" x="338" y="93" text-anchor="middle" dominant-baseline="central" fill="#cce4f7">클릭하여 설정</text>

  <!-- Data Gather_M -->
  <rect x="232" y="200" width="212" height="56" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="338" y="222" text-anchor="middle" dominant-baseline="central" fill="#fff">Data Gather_M</text>
  <text class="ts" x="338" y="243" text-anchor="middle" dominant-baseline="central" fill="#cce4f7">클릭하여 설정</text>

  <!-- Data Gather_S1 -->
  <rect x="232" y="310" width="212" height="56" rx="8" fill="#378ADD" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="338" y="332" text-anchor="middle" dominant-baseline="central" fill="#fff">Data Gather_S1</text>
  <text class="ts" x="338" y="353" text-anchor="middle" dominant-baseline="central" fill="#cce4f7">클릭하여 설정</text>

  <!-- Repository cylinder -->
  <ellipse cx="344" cy="403" rx="60" ry="11" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
  <rect x="284" y="403" width="120" height="44" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.8"/>
  <ellipse cx="344" cy="447" rx="60" ry="11" fill="#B4B2A9" stroke="#5F5E5A" stroke-width="0.8"/>
  <text class="th" x="344" y="427" text-anchor="middle" dominant-baseline="central" fill="#444441">Repository</text>

  <!-- Data Gather_S1 bottom → Repository top: blue -->
  <line x1="344" y1="366" x2="344" y2="391" stroke="#378ADD" stroke-width="1.8" fill="none" marker-end="url(#ab)"/>

  <!-- Repository → PlatformJS: purple -->
  <line x1="400" y1="403" x2="440" y2="108" stroke="#7F77DD" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>

  <!-- Data Gather_S1 top → Data Gather_M bottom: red -->
  <line x1="338" y1="310" x2="338" y2="258" stroke="#E24B4A" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- Data Gather_M top → PlatformJS bottom: red -->
  <line x1="338" y1="200" x2="338" y2="108" stroke="#E24B4A" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- Oracle right → PlatformJS left: green -->
  <line x1="152" y1="83" x2="230" y2="73" stroke="#1D9E75" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>

  <!-- RTS right → PlatformJS left: green -->
  <line x1="168" y1="205" x2="230" y2="68" stroke="#1D9E75" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>

  <!-- RTS right → Data Gather_M left: blue -->
  <line x1="168" y1="225" x2="230" y2="228" stroke="#378ADD" stroke-width="1.8" fill="none" marker-end="url(#ab)"/>

  <!-- RTS right → Data Gather_S1 left: blue dashed -->
  <line x1="168" y1="238" x2="230" y2="338" stroke="#378ADD" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#ab)"/>

  <!-- Real-time Monitor -->
  <rect x="492" y="45" width="172" height="56" rx="8" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="578" y="67" text-anchor="middle" dominant-baseline="central" fill="#fff">Real-time</text>
  <text class="th" x="578" y="88" text-anchor="middle" dominant-baseline="central" fill="#fff">Monitor</text>

  <!-- Performance Analyzer -->
  <rect x="492" y="150" width="172" height="56" rx="8" fill="#7F77DD" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="578" y="172" text-anchor="middle" dominant-baseline="central" fill="#fff">Performance</text>
  <text class="th" x="578" y="193" text-anchor="middle" dominant-baseline="central" fill="#fff">Analyzer</text>

  <!-- PlatformJS right → Real-time Monitor left: green -->
  <line x1="444" y1="73" x2="490" y2="73" stroke="#1D9E75" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>

  <!-- PlatformJS right → Performance Analyzer left: purple -->
  <line x1="444" y1="88" x2="490" y2="173" stroke="#7F77DD" stroke-width="1.8" fill="none" marker-end="url(#ap)"/>

</svg>
</body>
</html>
